description: >
  A single, complete job to run Cypress tests

parameters:
  working-directory:
    description: Directory containing package.json
    type: string
    default: "."
  start-command:
    description: Command used to start your local dev server for Cypress to tests against
    type: string
    default: ""
  cypress-command:
    description: Command used to run your Cypress tests
    type: string
    default: "npx cypress run"
  max-auto-reruns:
    description: >
      Number of additional times CircleCI should automatically rerun the
      Cypress run step if it fails. Accepts 0 to 5; 0 (default) disables
      auto-rerun. Values above 5 are not supported by CircleCI. Useful
      for known-flaky test suites where you want CircleCI's native
      step-level retry rather than rerunning the whole workflow. See
      https://circleci.com/docs/guides/orchestrate/automatic-reruns/

      auto_rerun_delay is intentionally not exposed as a parameter — the
      CircleCI orb validator pre-checks the delay value against a
      time-format regex before substituting parameters, which fails on
      any "<< parameters.x >>" expression. Reruns happen with the default
      0s delay; if you need a delay, file an issue.
    type: integer
    default: 0

steps:
  - when:
      condition: << parameters.start-command >>
      steps:
        - run:
            name: Start Server
            command: << parameters.start-command >>
            background: true
            working_directory: << parameters.working-directory >>
  # Run Cypress step variants. Exactly one runs per job.
  # `max_auto_reruns` only accepts an integer from 1 to 5, and CircleCI's
  # config validator checks every when/unless branch, including branches
  # whose condition is false. Substituting `<< parameters.max-auto-reruns >>`
  # into the field would put the default `0` into the unused branch and
  # fail validation ("max_auto_reruns must be an integer between 1 and 5").
  # So each allowed value gets its own branch with a literal number, and
  # the field is omitted entirely when max-auto-reruns is 0 (the default).
  - unless:
      condition: << parameters.max-auto-reruns >>
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
  - when:
      condition:
        equal: [ 1, << parameters.max-auto-reruns >> ]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 1
  - when:
      condition:
        equal: [ 2, << parameters.max-auto-reruns >> ]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 2
  - when:
      condition:
        equal: [ 3, << parameters.max-auto-reruns >> ]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 3
  - when:
      condition:
        equal: [ 4, << parameters.max-auto-reruns >> ]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 4
  - when:
      condition:
        equal: [ 5, << parameters.max-auto-reruns >> ]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 5
  - store_artifacts:
      path: << parameters.working-directory >>/cypress/videos
  - store_artifacts:
      path: << parameters.working-directory >>/cypress/screenshots
