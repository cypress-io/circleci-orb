description: >
  A single, complete job to run Cypress tests

parameters:
  working-directory:
    description: Directory containing package.json
    type: string
    default: "."
  start-command:
    description: Command used to start your local dev server for Cypress to tests against
    type: string
    default: ""
  cypress-command:
    description: Command used to run your Cypress tests
    type: string
    default: "npx cypress run"
  max-auto-reruns:
    description: >
      Number of additional times CircleCI should automatically rerun the
      Cypress run step if it fails. Must be between 0 and 5. 0 (default)
      disables auto-rerun. Useful for known-flaky test suites where you
      want CircleCI's native step-level retry rather than rerunning the
      whole workflow. See
      https://circleci.com/docs/guides/orchestrate/automatic-reruns/

      auto_rerun_delay is intentionally not exposed as a parameter — the
      CircleCI orb validator pre-checks the delay value against a
      time-format regex before substituting parameters, which fails on
      any "<< parameters.x >>" expression. Reruns happen with the default
      0s delay; if you need a delay, file an issue.
    type: integer
    default: 0

steps:
  - when:
      condition: << parameters.start-command >>
      steps:
        - run:
            name: Start Server
            command: << parameters.start-command >>
            background: true
            working_directory: << parameters.working-directory >>
  # Variants of the Run Cypress step. Only one runs per job.
  # `max_auto_reruns` only accepts a hardcoded integer between 1 and 5 —
  # CircleCI validates the field before substituting parameters, so
  # `max_auto_reruns: << parameters.max-auto-reruns >>` fails validation.
  # Each allowed value gets its own when-block with a literal value, and
  # 0 (the default) omits the field entirely since the field's schema
  # requires >= 1.
  - unless:
      condition: << parameters.max-auto-reruns >>
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
  - when:
      condition:
        equal: [1, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 1
  - when:
      condition:
        equal: [2, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 2
  - when:
      condition:
        equal: [3, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 3
  - when:
      condition:
        equal: [4, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 4
  - when:
      condition:
        equal: [5, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Run Cypress
            command: << parameters.cypress-command >>
            working_directory: << parameters.working-directory >>
            max_auto_reruns: 5
  - when:
      condition:
        not:
          or:
            - equal: [0, << parameters.max-auto-reruns >>]
            - equal: [1, << parameters.max-auto-reruns >>]
            - equal: [2, << parameters.max-auto-reruns >>]
            - equal: [3, << parameters.max-auto-reruns >>]
            - equal: [4, << parameters.max-auto-reruns >>]
            - equal: [5, << parameters.max-auto-reruns >>]
      steps:
        - run:
            name: Validate max-auto-reruns
            command: |
              echo "max-auto-reruns must be an integer between 0 and 5, got: << parameters.max-auto-reruns >>"
              exit 1
  - store_artifacts:
      path: << parameters.working-directory >>/cypress/videos
  - store_artifacts:
      path: << parameters.working-directory >>/cypress/screenshots
